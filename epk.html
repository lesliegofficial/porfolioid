<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Portfolio — PorfolioID</title>
  <meta name="description" content="A professional identity and portfolio platform for modern creatives and professionals. Powered by PorfolioID.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/epk.css">
</head>
<body>

<nav>
  <a href="/index.html" class="nav-logo">Porfolio<span>ID</span></a>
  <ul class="nav-links" id="navLinks"></ul>
  <a href="/dashboard.html" class="nav-edit-btn" id="editBtn">Edit Portfolio</a>
</nav>

<div id="epkContent"></div>

<footer>
  <div class="footer-logo" id="footerLogo"></div>
  <div class="footer-copy">All rights reserved</div>
</footer>

<script src="/epk.js" defer></script>

<!-- Credit Detail Modal -->
<div class="credit-modal-overlay" id="creditModalOverlay" onclick="if(event.target===this)closeCreditModal()">
  <div class="credit-modal">
    <button class="credit-modal-close" onclick="closeCreditModal()">✕ CLOSE</button>
    <div class="credit-modal-artist" id="creditModalArtist"></div>
    <div class="credit-modal-meta" id="creditModalMeta"></div>
    <div class="credit-modal-desc" id="creditModalDesc"></div>
    <div id="creditModalCollaborators"></div>
    <div id="creditModalMedia" style="margin-top:1.25rem"></div>
    <div class="credit-modal-photos" id="creditModalPhotos"></div>
  </div>
</div>

<!-- Lightbox -->
<div id="lightboxOverlay" onclick="closeLightbox()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:9999;align-items:center;justify-content:center;cursor:zoom-out">
  <img id="lightboxImg" src="" style="max-width:92vw;max-height:92vh;object-fit:contain">
</div>

<!-- Owner Bar -->
<div class="owner-bar">
  <span class="owner-bar-label">✦ Owner Mode — Hover items to reorder</span>
  <a href="/dashboard.html" style="font-family:var(--font-mono);font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--gold);text-decoration:none;border:1px solid rgba(201,168,76,0.3);padding:0.4rem 0.9rem;transition:all 0.2s">Dashboard →</a>
</div>

</body>
</html>
