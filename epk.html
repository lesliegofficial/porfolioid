<!DOCTYPE html>
<html lang="en">
<head>
<script
  src="https://js.sentry-cdn.com/35947cf71d8837f6400d73a0272919a6.min.js"
  crossorigin="anonymous"
></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Professional Portfolio — PorfolioID</title>
<meta name="description" id="pageDesc" content="A professional identity and portfolio platform for modern creatives and professionals. Powered by PorfolioID.">

<!-- Open Graph / Link Preview -->
<meta property="og:type" content="profile">
<meta property="og:site_name" content="PorfolioID">
<meta property="og:title" id="ogTitle" content="Professional Portfolio — PorfolioID">
<meta property="og:description" id="ogDesc" content="View this professional portfolio on PorfolioID.">
<meta property="og:image" id="ogImage" content="https://porfolioid.com/og-default.png">
<meta property="og:url" id="ogUrl" content="https://porfolioid.com">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" id="twTitle" content="Professional Portfolio — PorfolioID">
<meta name="twitter:description" id="twDesc" content="View this professional portfolio on PorfolioID.">
<meta name="twitter:image" id="twImage" content="https://porfolioid.com/og-default.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/epk.css?v=20260616-15">
</head>
<body>

<nav>
  <a href="/index.html" class="nav-logo">Porfolio<span>ID</span></a>
  <ul class="nav-links" id="navLinks"></ul>
  <div style="display:flex;align-items:center;gap:0.75rem">
    <button onclick="toggleLang('en')" id="langEN" style="font-family:var(--font-mono);font-size:0.55rem;letter-spacing:0.1em;background:rgba(201,168,76,0.15);color:var(--gold);border:1px solid rgba(201,168,76,0.4);padding:0.3rem 0.6rem;cursor:pointer;transition:all 0.2s">EN</button>
    <button onclick="toggleLang('es')" id="langES" style="font-family:var(--font-mono);font-size:0.55rem;letter-spacing:0.1em;background:none;color:rgba(255,255,255,0.3);border:1px solid rgba(255,255,255,0.15);padding:0.3rem 0.6rem;cursor:pointer;transition:all 0.2s">ES</button>
    <button onclick="toggleEditMode()" class="nav-edit-btn" id="editBtn">Edit Portfolio</button>
  </div>
</nav>


<!-- INLINE EDIT TOOLBAR -->
<div id="inlineEditBar" style="display:none;position:fixed;top:0;left:0;right:0;z-index:8000;background:rgba(10,10,10,0.97);border-bottom:1px solid rgba(201,168,76,0.3);padding:0.6rem 1.5rem;display:none;align-items:center;gap:1rem;flex-wrap:wrap">
  <span style="font-family:var(--font-mono);font-size:0.55rem;letter-spacing:0.2em;color:var(--gold);text-transform:uppercase">✏ Edit Mode</span>
  <div style="width:1px;height:20px;background:rgba(255,255,255,0.1)"></div>
  <div style="display:flex;align-items:center;gap:0.5rem">
    <span style="font-family:var(--font-mono);font-size:0.55rem;letter-spacing:0.1em;color:rgba(255,255,255,0.4);text-transform:uppercase">Font Size</span>
    <select id="editFontSize" onchange="applyFontSize()" style="font-family:var(--font-mono);font-size:0.65rem;background:#1a1a1a;color:var(--white);border:1px solid rgba(255,255,255,0.15);padding:0.25rem 0.5rem;cursor:pointer">
      <option value="12">12px</option>
      <option value="14">14px</option>
      <option value="16" selected>16px</option>
      <option value="18">18px</option>
      <option value="20">20px</option>
      <option value="22">22px</option>
    </select>
  </div>
  <label style="display:flex;align-items:center;gap:0.4rem;font-family:var(--font-mono);font-size:0.6rem;letter-spacing:0.08em;color:rgba(255,255,255,0.5);cursor:pointer">
    <input type="checkbox" id="applyToAll" style="accent-color:var(--gold)"> Apply to all text
  </label>
  <div style="width:1px;height:20px;background:rgba(255,255,255,0.1)"></div>
  <div style="display:flex;align-items:center;gap:0.5rem">
    <span style="font-family:var(--font-mono);font-size:0.55rem;letter-spacing:0.1em;color:rgba(255,255,255,0.4);text-transform:uppercase">Bio Width</span>
    <input type="range" id="bioWidthSlider" min="200" max="600" value="380" step="10" oninput="adjustBioWidth(this.value)" style="width:100px;accent-color:var(--gold)">
    <span id="bioWidthVal" style="font-family:var(--font-mono);font-size:0.6rem;color:var(--gold);min-width:35px">380px</span>
  </div>
  <div style="width:1px;height:20px;background:rgba(255,255,255,0.1)"></div>
  <div style="display:flex;gap:0.5rem;margin-left:auto">
    <button onclick="saveInlineEdits()" style="font-family:var(--font-mono);font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;background:var(--gold);color:#000;border:none;padding:0.4rem 1rem;cursor:pointer;font-weight:600">✓ Save Changes</button>
    <button onclick="toggleEditMode()" style="font-family:var(--font-mono);font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;background:none;color:rgba(255,255,255,0.4);border:1px solid rgba(255,255,255,0.15);padding:0.4rem 0.75rem;cursor:pointer">✕ Exit</button>
  </div>
</div>

<div id="epkContent"></div>

<footer>
  <div class="footer-logo" id="footerLogo"></div>
  <div class="footer-copy">All rights reserved</div>
</footer>

<script src="/epk.js?v=2.7.63" defer></script>

<!-- Credit Detail Modal -->
<div class="credit-modal-overlay" id="creditModalOverlay" onclick="if(event.target===this)closeCreditModal()">
  <div class="credit-modal">
    <button class="credit-modal-close" onclick="closeCreditModal()">✕ CLOSE</button>
    <div class="credit-modal-artist" id="creditModalArtist"></div>
    <div class="credit-modal-meta" id="creditModalMeta"></div>
    <div class="modal-font-controls">
      <span class="modal-font-label">Text Size</span>
      <button class="modal-font-btn" onclick="adjustModalFont(-1)">A−</button>
      <button class="modal-font-btn" onclick="adjustModalFont(0)">A</button>
      <button class="modal-font-btn" onclick="adjustModalFont(1)">A+</button>
    </div>
    <div class="credit-modal-desc" id="creditModalDesc"></div>
    <div id="creditModalCollaborators"></div>
    <div id="creditModalMedia" style="margin-top:1.25rem"></div>
    <div class="credit-modal-photos" id="creditModalPhotos"></div>
    <div id="creditModalPress"></div>
  </div>
</div>

<!-- Lightbox -->
<div id="lightboxOverlay" onclick="closeLightbox()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:9999;align-items:center;justify-content:center;cursor:zoom-out">
  <img id="lightboxImg" src="" style="max-width:92vw;max-height:92vh;object-fit:contain">
</div>

<!-- Award Modal -->
<div id="awardModalOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:1000;align-items:center;justify-content:center;padding:1rem" onclick="if(event.target===this)closeAwardModal()">
  <div style="background:#111;border:1px solid rgba(201,168,76,0.2);max-width:860px;width:100%;max-height:90vh;overflow-y:auto;position:relative">
    <button onclick="closeAwardModal()" style="position:absolute;top:1rem;right:1rem;background:none;border:none;color:#888;font-size:1rem;cursor:pointer;font-family:monospace;letter-spacing:0.1em;z-index:1">✕ CLOSE</button>
    <div id="awardModalContent" style="padding:2rem"></div>
  </div>
</div>

<!-- Inquiry Modal -->
<div id="inquiryModalOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:1000;align-items:center;justify-content:center;padding:1rem" onclick="if(event.target===this)closeInquiryModal()">
  <div style="background:#111;border:1px solid rgba(201,168,76,0.2);max-width:640px;width:100%;max-height:90vh;overflow-y:auto;position:relative">
    <button onclick="closeInquiryModal()" style="position:absolute;top:1rem;right:1rem;background:none;border:none;color:#888;font-size:1rem;cursor:pointer;font-family:monospace;letter-spacing:0.1em;z-index:1">✕ CLOSE</button>
    <div id="inquiryModalContent" style="padding:2.5rem"></div>
  </div>
</div>

<!-- Share Modal -->
<div id="shareModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:1000;align-items:center;justify-content:center">
  <div style="background:#111;border:1px solid rgba(201,168,76,0.2);padding:2.5rem;max-width:420px;width:90%;position:relative">
    <button onclick="closeShareModal()" style="position:absolute;top:1rem;right:1rem;background:none;border:none;color:#888;font-size:1.2rem;cursor:pointer">✕</button>
    <div style="font-family:monospace;font-size:0.55rem;letter-spacing:0.2em;text-transform:uppercase;color:#C9A84C;margin-bottom:0.5rem">Share Portfolio</div>
    <h3 style="font-size:1.2rem;color:#fff;margin-bottom:1.5rem;font-weight:400">Scan to view my PorfolioID</h3>
    <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:1.5rem">
      <div style="background:white;padding:0.75rem;margin-bottom:1rem" id="modalQRCode"></div>
      <div style="font-family:monospace;font-size:0.55rem;color:#888;text-align:center;word-break:break-all" id="modalQRUrl"></div>
    </div>
    <div style="display:flex;gap:0.75rem">
      <button onclick="copyEPKLink()" id="modalCopyBtn" style="flex:1;font-family:monospace;font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.3);color:#C9A84C;padding:0.75rem;cursor:pointer">⎘ Copy Link</button>
      <button onclick="downloadEPKQR()" style="flex:1;font-family:monospace;font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;background:#C9A84C;border:none;color:#000;padding:0.75rem;cursor:pointer">↓ Download QR</button>
    </div>
  </div>
</div>

<!-- Owner Bar -->
<div class="owner-bar">
  <span class="owner-bar-label">✦ Owner Mode — Hover items to reorder</span>
  <a href="/dashboard.html" style="font-family:var(--font-mono);font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--gold);text-decoration:none;border:1px solid rgba(201,168,76,0.3);padding:0.4rem 0.9rem;transition:all 0.2s">Dashboard →</a>
</div>

</body>
</html>
