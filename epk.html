<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Electronic Press Kit — PorfolioID</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #C9A84C; --gold-light: #E8C97A; --gold-dark: #8B6914;
    --black: #080808; --dark: #0E0E0E; --dark-2: #141414; --dark-3: #1C1C1C; --dark-4: #242424;
    --gray: #888; --gray-light: #BBBBBB; --white: #F5F3EE;
    --font-display: 'Playfair Display', Georgia, serif;
    --font-body: 'DM Sans', sans-serif; --font-mono: 'DM Mono', monospace;
  }
  html { scroll-behavior: smooth; }
  body { background: var(--black); color: var(--white); font-family: var(--font-body); font-weight: 300; line-height: 1.7; overflow-x: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 1000; opacity: 0.4;
  }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 1.25rem 3rem; display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(to bottom, rgba(8,8,8,0.95) 0%, transparent 100%);
    backdrop-filter: blur(8px);
  }
  .nav-logo { font-family: var(--font-display); font-size: 1.4rem; font-weight: 700; color: var(--white); text-decoration: none; letter-spacing: -0.02em; }
  .nav-logo span { color: var(--gold); }
  .nav-links { display: flex; gap: 2.5rem; list-style: none; }
  .nav-links a { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gray); text-decoration: none; transition: color 0.3s; }
  .nav-links a:hover { color: var(--gold); }
  .nav-edit-btn { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); text-decoration: none; border: 1px solid rgba(201,168,76,0.3); padding: 0.4rem 0.9rem; transition: all 0.3s; display: none; }
  .nav-edit-btn:hover { background: rgba(201,168,76,0.08); }
  .nav-edit-btn.visible { display: inline; }

  .hero { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; position: relative; overflow: hidden; }
  .hero-image-panel { position: relative; overflow: hidden; }
  .hero-image-panel::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to right, transparent 60%, var(--black) 100%), linear-gradient(to bottom, transparent 70%, var(--black) 100%); }
  .hero-img { width: 100%; height: 100%; object-fit: cover; object-position: top center; filter: grayscale(15%) contrast(1.05); }
  .hero-placeholder { width: 100%; height: 100%; background: linear-gradient(135deg, var(--dark-2) 0%, var(--dark-3) 100%); display: flex; align-items: center; justify-content: center; }
  .hero-placeholder-icon { font-size: 5rem; opacity: 0.2; }
  .hero-content { display: flex; flex-direction: column; justify-content: center; padding: 8rem 4rem 4rem 3rem; position: relative; }
  .hero-eyebrow { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--gold); margin-bottom: 1.5rem; opacity: 0.9; }
  .hero-name { font-family: var(--font-display); font-size: clamp(4rem, 7vw, 7.5rem); font-weight: 900; line-height: 0.9; letter-spacing: -0.02em; color: var(--white); margin-bottom: 1.5rem; }
  .hero-name em { font-style: italic; color: var(--gold-light); }
  .hero-tagline { font-size: 0.85rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gray); margin-bottom: 3rem; line-height: 2; border-left: 2px solid var(--gold); padding-left: 1rem; }
  .hero-ctas { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 4rem; }
  .btn-primary { background: var(--gold); color: var(--black); border: none; padding: 0.85rem 2rem; font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; transition: all 0.3s; font-weight: 500; }
  .btn-primary:hover { background: var(--gold-light); transform: translateY(-1px); }
  .btn-secondary { background: transparent; color: var(--white); border: 1px solid rgba(201,168,76,0.4); padding: 0.85rem 2rem; font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; transition: all 0.3s; }
  .btn-secondary:hover { border-color: var(--gold); color: var(--gold); }
  .hero-stats { display: flex; gap: 2.5rem; }
  .hero-stat-number { font-family: var(--font-display); font-size: 2rem; font-weight: 700; color: var(--gold); display: block; line-height: 1; }
  .hero-stat-label { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gray); display: block; margin-top: 0.25rem; }

  section { padding: 6rem 3rem; max-width: 1400px; margin: 0 auto; }
  .section-label { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.75rem; display: flex; align-items: center; gap: 1rem; }
  .section-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, rgba(201,168,76,0.3), transparent); max-width: 200px; }
  .section-title { font-family: var(--font-display); font-size: clamp(2rem, 4vw, 3.5rem); font-weight: 700; color: var(--white); line-height: 1.1; margin-bottom: 3rem; }
  .divider { width: 100%; height: 1px; background: linear-gradient(to right, transparent, rgba(201,168,76,0.2), transparent); margin: 0 3rem; max-width: 1400px; }

  /* BIO */
  .bio-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 5rem; align-items: start; }
  .bio-sidebar { position: sticky; top: 6rem; }
  .bio-portrait { width: 100%; aspect-ratio: 3/4; object-fit: cover; object-position: top; filter: grayscale(20%) contrast(1.05); margin-bottom: 2rem; }
  .bio-contact-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 0.8rem; color: var(--gray-light); }
  .bio-contact-dot { width: 4px; height: 4px; background: var(--gold); border-radius: 50%; flex-shrink: 0; }
  .bio-text p { font-size: 1rem; color: var(--gray-light); margin-bottom: 1.5em; line-height: 1.85; }
  .bio-text p:first-child { font-size: 1.15rem; color: var(--white); font-weight: 400; }
  .credentials-row { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 2rem; }
  .credential-badge { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; border: 1px solid rgba(201,168,76,0.4); color: var(--gold); padding: 0.4rem 0.85rem; }

  /* CREDITS */
  .credits-section { background: var(--dark-2); padding: 6rem 0; margin: 0; max-width: 100%; }
  .credits-inner { max-width: 1400px; margin: 0 auto; padding: 0 3rem; }
  .credits-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 1px; background: rgba(201,168,76,0.1); border: 1px solid rgba(201,168,76,0.1); }
  .credit-card { background: var(--dark-2); padding: 2rem; transition: background 0.3s; cursor: pointer; }
  .credit-card:hover { background: var(--dark-3); }
  .credit-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1rem; gap: 1rem; }
  .credit-artist { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; }
  .credit-years { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em; color: var(--gold); border: 1px solid rgba(201,168,76,0.3); padding: 0.25rem 0.6rem; white-space: nowrap; }
  .credit-role { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.75rem; }
  .credit-desc { font-size: 0.85rem; color: var(--gray); line-height: 1.7; white-space: pre-line; }
  .credit-expand-hint { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.08em; color: var(--gold); margin-top: 0.75rem; text-decoration: underline; text-underline-offset: 3px; }
  /* Credit detail modal */
  .credit-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9000; display: flex; align-items: center; justify-content: center; padding: 2rem; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .credit-modal-overlay.open { opacity: 1; pointer-events: all; }
  .credit-modal { background: var(--dark-2); border: 1px solid rgba(201,168,76,0.2); max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 2.5rem; position: relative; }
  .credit-modal-close { position: absolute; top: 1.25rem; right: 1.25rem; background: none; border: 1px solid rgba(255,255,255,0.1); color: var(--gray); font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em; padding: 0.4rem 0.75rem; cursor: pointer; }
  .credit-modal-close:hover { border-color: var(--gold); color: var(--white); }
  .credit-modal-artist { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; margin-bottom: 0.25rem; }
  .credit-modal-meta { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); margin-bottom: 1.5rem; }
  .credit-modal-desc { font-size: 0.9rem; color: var(--gray); line-height: 1.85; white-space: pre-line; margin-bottom: 1.5rem; }
  .credit-modal-photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.5rem; margin-top: 1.5rem; padding-bottom: 1rem; }
  .credit-modal-photo { width: 100%; object-fit: contain; background: var(--dark-3); cursor: pointer; border: 1px solid rgba(201,168,76,0.1); transition: opacity 0.2s; max-height: 280px; }
  .credit-modal-photo:hover { opacity: 0.85; }

  /* MUSIC */
  .music-tracks { border-top: 1px solid rgba(201,168,76,0.1); }
  .track-item { display: flex; align-items: center; gap: 2rem; padding: 1.25rem 0; border-bottom: 1px solid rgba(201,168,76,0.06); transition: background 0.2s; }
  .track-item:hover { background: rgba(201,168,76,0.02); }
  .track-num { font-family: var(--font-mono); font-size: 0.7rem; color: var(--gray); width: 2rem; text-align: right; flex-shrink: 0; }
  .track-info { flex: 1; }
  .track-title { font-size: 0.95rem; color: var(--white); font-weight: 400; margin-bottom: 0.2rem; display: flex; align-items: center; gap: 0.75rem; }
  .track-tag { font-family: var(--font-mono); font-size: 0.55rem; letter-spacing: 0.1em; background: rgba(201,168,76,0.12); color: var(--gold); padding: 0.2rem 0.5rem; }
  .track-artist { font-size: 0.8rem; color: var(--gray); }
  .track-meta { font-family: var(--font-mono); font-size: 0.6rem; color: var(--gray); margin-top: 0.15rem; letter-spacing: 0.05em; }
  .track-meta span { color: var(--gold); }
  .track-desc { font-size: 0.78rem; color: var(--gray); line-height: 1.6; margin-top: 0.4rem; font-style: italic; }
  .track-role { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gray); text-align: right; flex-shrink: 0; }

  /* VIDEOS */
  .videos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
  .video-card { background: var(--dark-3); overflow: hidden; cursor: pointer; position: relative; }
  .video-thumb { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: var(--dark-4); }
  .video-play { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--gold); display: flex; align-items: center; justify-content: center; color: var(--gold); font-size: 1rem; background: rgba(0,0,0,0.5); transition: all 0.3s; }
  .video-card:hover .video-play { background: var(--gold); color: var(--black); }
  .video-caption { padding: 0.75rem 1rem 0.4rem; font-size: 0.85rem; color: var(--white); font-weight: 400; }
  .video-meta { padding: 0 1rem 0.4rem; font-family: var(--font-mono); font-size: 0.6rem; color: var(--gray); letter-spacing: 0.05em; }
  .video-meta span { color: var(--gold); }
  .video-desc { padding: 0 1rem 0.75rem; font-size: 0.78rem; color: var(--gray); line-height: 1.6; font-style: italic; }

  /* PHOTOS */
  .gallery-section { background: var(--dark-2); padding: 6rem 0; max-width: 100%; }
  .gallery-inner { max-width: 1400px; margin: 0 auto; padding: 0 3rem; }
  .gallery-slideshows { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; height: 500px; margin-top: 2rem; }
  .gallery-col { position: relative; overflow: hidden; background: var(--dark-3); }
  .gallery-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s ease; }
  .gallery-slide.active { opacity: 1; }
  .gallery-slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gallery-caption { position: absolute; bottom: 0; left: 0; right: 0; padding: 2rem 1rem 0.75rem; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent); font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em; color: rgba(255,255,255,0.7); }
  .gallery-nav { position: absolute; bottom: 0.5rem; right: 0.75rem; display: flex; gap: 4px; z-index: 2; }
  .gallery-dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.3); cursor: pointer; transition: background 0.3s; }
  .gallery-dot.active { background: var(--gold); }
  .gallery-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.4); border: 1px solid rgba(201,168,76,0.2); color: var(--gold); width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2; font-size: 1rem; transition: all 0.3s; }
  .gallery-arrow:hover { background: rgba(201,168,76,0.2); }
  .gallery-arrow.prev { left: 0.5rem; }
  .gallery-arrow.next { right: 0.5rem; }

  /* GALLERY */
  .gallery-4col { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.75rem; margin-top: 1.5rem; }
  .gallery-col { position: relative; overflow: hidden; background: var(--dark-3); height: 360px; }
  .gallery-slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1s ease; }
  .gallery-slide.active { opacity: 1; }
  .gallery-slide img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; cursor: pointer; }
  .gallery-caption { position: absolute; bottom: 0; left: 0; right: 0; padding: 2rem 0.75rem 0.5rem; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent); font-family: var(--font-mono); font-size: 0.55rem; letter-spacing: 0.1em; color: rgba(255,255,255,0.7); }
  @media (max-width: 768px) { .gallery-4col { grid-template-columns: repeat(2, 1fr); } .gallery-col { height: 260px; } }

  /* ASSETS */
  .assets-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
  .asset-card { background: var(--dark-2); border: 1px solid rgba(201,168,76,0.08); padding: 2rem; transition: border-color 0.3s; }
  .asset-card:hover { border-color: rgba(201,168,76,0.25); }
  .asset-icon { font-size: 1.5rem; margin-bottom: 1rem; }
  .asset-title { font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; }
  .asset-desc { font-size: 0.85rem; color: var(--gray); line-height: 1.6; margin-bottom: 1.5rem; }
  .asset-btn { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); text-decoration: none; transition: opacity 0.3s; }
  .asset-btn:hover { opacity: 0.7; }

  /* BOOKING */
  .booking-section { background: linear-gradient(to bottom, var(--dark-2), var(--black)); padding: 8rem 3rem; text-align: center; }
  .booking-inner { max-width: 700px; margin: 0 auto; }
  .booking-title { font-family: var(--font-display); font-size: clamp(2.5rem, 5vw, 4.5rem); font-weight: 900; line-height: 1.1; margin-bottom: 1.5rem; }
  .booking-title em { font-style: italic; color: var(--gold-light); }
  .booking-sub { font-size: 1rem; color: var(--gray-light); margin-bottom: 0.75rem; }
  .booking-note { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 3rem; }
  .booking-ctas { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }

  /* IDENTITY BLOCKS */
  .identity-blocks { margin-top: 2rem; display: flex; flex-direction: column; gap: 1rem; }
  .identity-block { border-left: 2px solid rgba(201,168,76,0.3); padding-left: 1rem; }
  .identity-block-label { font-family: var(--font-mono); font-size: 0.55rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.4rem; opacity: 0.8; }
  .identity-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
  .identity-tag { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid rgba(201,168,76,0.3); color: var(--gray-light); padding: 0.3rem 0.75rem; }
  .identity-featured-credit { display: flex; flex-direction: column; gap: 0.15rem; }
  .identity-featured-artist { font-family: var(--font-display); font-size: 1rem; font-weight: 700; color: var(--white); }
  .identity-featured-role { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); }
  .identity-verified { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.15em; color: var(--gold); }
  .identity-langs { font-size: 0.85rem; color: var(--gray-light); letter-spacing: 0.05em; }
  .identity-rep { display: flex; flex-direction: column; gap: 0.15rem; }
  .identity-rep-name { font-size: 0.9rem; color: var(--white); font-weight: 400; }
  .identity-rep-role { font-family: var(--font-mono); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold); }
  .identity-rep-contact { font-size: 0.8rem; color: var(--gray); }
  .identity-timeline { display: flex; flex-direction: column; gap: 0.5rem; }
  .timeline-item { display: flex; gap: 1rem; align-items: baseline; }
  .timeline-year { font-family: var(--font-mono); font-size: 0.65rem; color: var(--gold); min-width: 36px; }
  .timeline-milestone { font-size: 0.85rem; color: var(--gray-light); }

  /* CONNECT SECTION */
  .connect-section { padding: 6rem 3rem; max-width: 1400px; margin: 0 auto; }
  .connect-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 2rem; }
  .connect-card { background: var(--dark-2); border: 1px solid rgba(201,168,76,0.1); padding: 2rem; }
  .connect-card-title { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--gold); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem; }
  .connect-card-title::after { content: ''; flex: 1; height: 1px; background: linear-gradient(to right, rgba(201,168,76,0.2), transparent); }
  .connect-links { display: flex; flex-direction: column; gap: 0.5rem; }
  .connect-link { display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem; text-decoration: none; color: var(--gray-light); font-size: 0.85rem; transition: all 0.2s; border: 1px solid transparent; }
  .connect-link:hover { color: var(--gold); border-color: rgba(201,168,76,0.15); background: rgba(201,168,76,0.03); }
  .connect-link svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; opacity: 0.7; }
  .connect-link:hover svg { opacity: 1; }
  .connect-link-label { font-size: 0.85rem; }
  .connect-link-url { font-family: var(--font-mono); font-size: 0.6rem; color: var(--gray); margin-left: auto; letter-spacing: 0.05em; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  @media (max-width: 768px) { .connect-grid { grid-template-columns: 1fr; } }

  footer { border-top: 1px solid rgba(201,168,76,0.08); padding: 2rem 3rem; display: flex; justify-content: space-between; align-items: center; }
  .footer-logo { font-family: var(--font-mono); font-size: 0.65rem; letter-spacing: 0.15em; color: var(--gray); }
  .footer-copy { font-family: var(--font-mono); font-size: 0.6rem; color: var(--gray); letter-spacing: 0.1em; }

  @media (max-width: 768px) {
    .hero { grid-template-columns: 1fr; }
    .hero-image-panel { height: 50vh; }
    .bio-grid { grid-template-columns: 1fr; }
    .gallery-slideshows { grid-template-columns: 1fr; height: auto; }
    .gallery-col { height: 300px; }
    nav { padding: 1rem 1.5rem; }
    .nav-links { display: none; }
    section { padding: 4rem 1.5rem; }
  }
</style>
</head>
<body>

<nav>
  <a href="/index.html" class="nav-logo">Porfolio<span>ID</span></a>
  <ul class="nav-links" id="navLinks"></ul>
  <a href="/dashboard.html" class="nav-edit-btn" id="editBtn">Edit EPK</a>
</nav>

<div id="epkContent"></div>

<footer>
  <div class="footer-logo" id="footerLogo"></div>
  <div class="footer-copy">All rights reserved</div>
</footer>

<script>
function getSlugFromURL() {
  const params = new URLSearchParams(window.location.search);
  const fromQuery = params.get('slug');
  if (fromQuery) return fromQuery;
  const match = window.location.pathname.match(/\/epk\/([^\/]+)/);
  return match ? match[1] : null;
}

function getEPKData(slug) {
  const users = JSON.parse(localStorage.getItem('porfolioid_users') || '[]');
  const user = users.find(u => u.slug === slug || u.epk?.slug === slug);
  return user ? user.epk : null;
}

function getYouTubeThumb(url) {
  const match = url.match(/youtube\.com.*v=([^&]+)|youtu\.be\/([^?]+)/);
  return match ? `https://img.youtube.com/vi/${match[1]||match[2]}/hqdefault.jpg` : null;
}

function buildEPK(epk) {
  const nameParts = (epk.name || 'Artist Name').split(' ');
  const firstName = nameParts[0];
  const lastName = nameParts.slice(1).join(' ');

  // Build nav
  const navLinks = document.getElementById('navLinks');
  const sections = [
    { id: 'bio', label: 'Biography' },
    { id: 'credits', label: 'Credits' },
    { id: 'music', label: 'Music' },
    { id: 'videos', label: 'Video' },
    { id: 'photos', label: 'Photos' },
    { id: 'assets', label: 'Assets' },
    { id: 'booking', label: 'Booking' },
  ];
  sections.forEach(s => {
    navLinks.innerHTML += `<li><a href="#${s.id}">${s.label}</a></li>`;
  });

  document.getElementById('footerLogo').textContent = `${epk.name} — EPK 2025`;
  document.title = `${epk.name} — Electronic Press Kit`;

  // Show edit button if logged in as this artist
  try {
    const session = JSON.parse(localStorage.getItem('porfolioid_session') || 'null');
    if (session && session.slug === epk.slug) {
      document.getElementById('editBtn').classList.add('visible');
    }
  } catch(e) {}

  // Store credits for modal access
  epkCreditsData = epk.credits || [];

  // Build connect section
  const svgIcons = {
    instagram: '<svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>',
    facebook: '<svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>',

    linkedin: '<svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>',
    website: '<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>',
    spotify: '<svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>',
    appleMusic: '<svg viewBox="0 0 24 24"><path d="M23.994 6.124a9.23 9.23 0 00-.24-2.19c-.317-1.31-1.062-2.31-2.18-3.043a5.022 5.022 0 00-1.076-.525c-.378-.127-.76-.2-1.147-.232-.238-.018-.48-.026-.72-.026H5.37c-.24 0-.482.008-.72.026-.387.032-.77.105-1.147.232a5.022 5.022 0 00-1.076.525C1.308 1.624.563 2.624.246 3.934A9.23 9.23 0 00.006 6.124C-.005 6.4 0 6.678 0 6.956v10.088c0 .278-.005.556.006.832.03.732.15 1.46.42 2.153.386 1.01 1.05 1.802 1.97 2.356a5.4 5.4 0 001.574.62c.44.098.886.148 1.336.162.287.008.576.012.864.012h13.66c.288 0 .577-.004.864-.012.45-.014.896-.064 1.336-.163a5.4 5.4 0 001.573-.619c.92-.554 1.584-1.346 1.97-2.356.27-.692.39-1.42.42-2.153.011-.276.006-.554.006-.832V6.956c0-.278.005-.556-.006-.832zm-7.27 8.526a.93.93 0 01-.415.79.894.894 0 01-.501.147.928.928 0 01-.443-.11L9.1 12.74v4.613a.933.933 0 01-.933.934.933.933 0 01-.933-.934V6.647a.933.933 0 01.597-.87.928.928 0 011.006.201l6.554 4.04V6.647a.933.933 0 01.933-.934.933.933 0 01.933.934v8.003z"/></svg>',
    youtube: '<svg viewBox="0 0 24 24"><path d="M23.495 6.205a3.007 3.007 0 00-2.088-2.088c-1.87-.501-9.396-.501-9.396-.501s-7.507-.01-9.396.501A3.007 3.007 0 00.527 6.205a31.247 31.247 0 00-.522 5.805 31.247 31.247 0 00.522 5.783 3.007 3.007 0 002.088 2.088c1.868.502 9.396.502 9.396.502s7.506 0 9.396-.502a3.007 3.007 0 002.088-2.088 31.247 31.247 0 00.5-5.783 31.247 31.247 0 00-.5-5.805zM9.609 15.601V8.408l6.264 3.602z"/></svg>',
    soundcloud: '<svg viewBox="0 0 24 24"><path d="M1.175 12.225c-.015 0-.03.002-.044.003C.5 12.28 0 12.84 0 13.516c0 .682.504 1.235 1.124 1.235.02 0 .038-.002.057-.003h.05c.02 0 .038.003.058.003h16.754c.62 0 1.123-.553 1.123-1.235 0-.642-.45-1.17-1.03-1.233a2.95 2.95 0 00.03-.396c0-1.66-1.396-3.005-3.12-3.005-.23 0-.455.026-.67.074C13.74 7.48 12.174 6.5 10.38 6.5c-2.537 0-4.595 1.988-4.595 4.442 0 .08.003.158.008.236-.013-.001-.026-.002-.04-.002-1.326 0-2.4 1.048-2.4 2.342 0 .25.042.49.117.716H1.175zm21.649-3.335c-.007 0-.014.001-.021.002-.007-1.638-1.365-2.962-3.038-2.962-.476 0-.928.11-1.33.307-.657-1.49-2.173-2.527-3.936-2.527-2.369 0-4.29 1.854-4.29 4.142 0 .075.002.149.006.223-.011 0-.023-.002-.034-.002-1.238 0-2.242.978-2.242 2.185 0 1.207 1.004 2.185 2.242 2.185h12.643c1.238 0 2.242-.978 2.242-2.185 0-1.172-.948-2.13-2.142-2.168z"/></svg>',
    tidal: '<svg viewBox="0 0 24 24"><path d="M12.012 3.992L8.008 7.996 4.004 3.992 0 7.996l4.004 4.004 4.004-4.004 4.004 4.004 4.004-4.004zM8.008 16.004l4.004-4.004 4.004 4.004L20.02 12l-4.004-4.004-4.004 4.004-4.004-4.004L4.004 12z"/></svg>',
    bandcamp: '<svg viewBox="0 0 24 24"><path d="M0 18.75l7.437-13.5H24l-7.438 13.5z"/></svg>',
  };

  const multiKeys = ['instagram','facebook','website'];
  const labels = { instagram:'Instagram', facebook:'Facebook', tiktok:'TikTok', linkedin:'LinkedIn', website:'Website', spotify:'Spotify', appleMusic:'Apple Music', youtube:'YouTube', soundcloud:'SoundCloud', tidal:'Tidal', bandcamp:'Bandcamp' };

  const buildConnectLinks = (keys, s) => keys.flatMap(k => {
    const val = s[k];
    if (!val) return [];
    const urls = Array.isArray(val) ? val.filter(Boolean) : (val ? [val] : []);
    if (!urls.length) return [];
    return urls.map((url, i) => {
      const domain = (() => { try { return new URL(url).hostname.replace('www.',''); } catch { return ''; } })();
      const labelSuffix = urls.length > 1 ? ` <span style="font-size:0.55rem;opacity:0.6">${i+1}</span>` : '';
      return `<a href="${url}" class="connect-link" target="_blank" rel="noopener">${svgIcons[k]}<span class="connect-link-label">${labels[k]}${labelSuffix}</span><span class="connect-link-url">${domain}</span></a>`;
    });
  }).join('');

  const s = epk.socials || {};
  const socialKeys = ['instagram','facebook','tiktok','linkedin','website'];
  const musicKeys = ['spotify','appleMusic','youtube','soundcloud','tidal','bandcamp'];
  const hasValue = (v) => Array.isArray(v) ? v.some(Boolean) : !!v;
  const hasSocials = socialKeys.some(k => hasValue(s[k]));
  const hasMusic = musicKeys.some(k => hasValue(s[k]));

  const connectSectionHTML = (hasSocials || hasMusic) ? `
    <div class="connect-section">
      <div class="section-label">Connect</div>
      <h2 class="section-title">Find Me Online</h2>
      <div class="connect-grid">
        ${hasSocials ? `
        <div class="connect-card">
          <div class="connect-card-title">Social Platforms</div>
          <div class="connect-links">${buildConnectLinks(socialKeys, s)}</div>
        </div>` : ''}
        ${hasMusic ? `
        <div class="connect-card">
          <div class="connect-card-title">Music Platforms</div>
          <div class="connect-links">${buildConnectLinks(musicKeys, s)}</div>
        </div>` : ''}
      </div>
    </div>
    <div class="divider"></div>` : '';

  const statsHTML = (epk.stats || []).filter(s => s.number).map(s => `
    <div>
      <span class="hero-stat-number">${s.number}</span>
      <span class="hero-stat-label">${s.label}</span>
    </div>`).join('');

  const taglinesHTML = (epk.taglines || []).join('<br>');

  const heroImgHTML = epk.heroImage
    ? `<img class="hero-img" src="${epk.heroImage}" alt="${epk.name}" onerror="this.parentElement.innerHTML='<div class=hero-placeholder><div class=hero-placeholder-icon>🎤</div></div>'">`
    : `<div class="hero-placeholder"><div class="hero-placeholder-icon">🎤</div></div>`;

  const bioImgHTML = epk.bioImage
    ? `<img class="bio-portrait" src="${epk.bioImage}" alt="${epk.name}" onerror="this.style.display='none'">`
    : '';

  const contactHTML = [
    epk.location ? `<div class="bio-contact-item"><span class="bio-contact-dot"></span><span>Based in ${epk.location}</span></div>` : '',
    epk.availability ? `<div class="bio-contact-item"><span class="bio-contact-dot"></span><span>${epk.availability}</span></div>` : '',
    `<div class="bio-contact-item"><span class="bio-contact-dot"></span><span>Contact available upon request</span></div>`,
  ].join('');

  const credentialsHTML = (epk.credentials || []).length
    ? `<div class="credentials-row">${epk.credentials.map(c => `<span class="credential-badge">${c}</span>`).join('')}</div>`
    : '';

  const bioParagraphs = (epk.bio || '').split('\n').filter(p => p.trim()).map(p => `<p>${p}</p>`).join('');

  // Sort: pinned first, filter hidden
  const visibleCredits = (epk.credits || [])
    .map((c, i) => ({...c, _origIdx: i}))
    .filter(c => c.visible !== false)
    .sort((a, b) => (b.pinned?1:0) - (a.pinned?1:0));
  epkVisibleCredits = visibleCredits;

  const creditsHTML = visibleCredits.map((c, i) => {
    const origI = c._origIdx;
    const hasPhotos = c.photos && c.photos.length > 0;
    const hasDetail = c.fullDesc || hasPhotos || c.mediaLink || c.videoUrl;
    const categoryBadge = c.category ? `<span style="font-family:var(--font-mono);font-size:0.5rem;letter-spacing:0.1em;text-transform:uppercase;background:rgba(201,168,76,0.08);color:var(--gray);padding:0.15rem 0.5rem;margin-right:0.4rem">${c.category}</span>` : '';
    const verifiedBadge = c.verified ? `<span style="font-family:var(--font-mono);font-size:0.5rem;letter-spacing:0.1em;text-transform:uppercase;background:rgba(100,200,100,0.1);color:#7ec97e;padding:0.15rem 0.5rem">✦ VERIFIED</span>` : '';
    const pinnedBadge = c.pinned ? `<span style="font-family:var(--font-mono);font-size:0.5rem;letter-spacing:0.1em;text-transform:uppercase;background:rgba(201,168,76,0.12);color:var(--gold);padding:0.15rem 0.5rem">📌 FEATURED</span>` : '';
    const badgesRow = (categoryBadge || verifiedBadge || pinnedBadge) ? `<div style="margin-bottom:0.5rem;display:flex;gap:0.3rem;flex-wrap:wrap">${pinnedBadge}${verifiedBadge}${categoryBadge}</div>` : '';
    const collaboratorsRow = c.collaborators?.length ? `<div style="font-family:var(--font-mono);font-size:0.55rem;color:var(--gray);margin-top:0.3rem;letter-spacing:0.08em">w/ ${c.collaborators.join(', ')}</div>` : '';
    return `
    <div class="credit-card" ${hasDetail ? `onclick="openCreditModal(${i})"` : ''}>
      ${badgesRow}
      <div class="credit-header">
        <div class="credit-artist">${c.artist}</div>
        ${c.years ? `<span class="credit-years">${c.years}</span>` : ''}
      </div>
      <div class="credit-role">${c.role}${c.contractType ? ` · <span style="opacity:0.7">${c.contractType}</span>` : ''}</div>
      ${collaboratorsRow}
      ${c.desc ? `<p class="credit-desc" style="-webkit-line-clamp:3;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden">${c.desc}</p>` : ''}
      ${hasDetail ? `<div class="credit-expand-hint">View Details →</div>` : ''}
    </div>`;
  }).join('');

  // Filter hidden & unreleased tracks
  const visibleTracks = (epk.tracks || []).filter(t => t.visible !== false && !t.unreleased);

  const tracksHTML = visibleTracks.map((t, i) => {
    const isMP3 = t.link && (t.link.includes('.mp3') || t.link.includes('cloudinary') || t.link.includes('.wav') || t.link.includes('.ogg'));
    const linkHTML = t.link ? (isMP3
      ? `<audio controls style="width:100%;height:32px;margin-top:0.5rem;opacity:0.8;accent-color:var(--gold)" src="${t.link}"></audio>`
      : `<a href="${t.link}" target="_blank" style="font-family:var(--font-mono);font-size:0.6rem;color:var(--gold);letter-spacing:0.1em">Listen →</a>`)
      : '';
    return `
    <div class="track-item">
      <span class="track-num">0${i+1}</span>
      <div class="track-info">
        <div class="track-title">${t.title} ${t.tag ? `<span class="track-tag">${t.tag}</span>` : ''}</div>
        <div class="track-artist">${t.artist}</div>
        ${(t.album || t.year) ? `<div class="track-meta">${t.album ? `<span>${t.album}</span>` : ''}${t.album && t.year ? ' · ' : ''}${t.year || ''}</div>` : ''}
        ${t.desc ? `<div class="track-desc">${t.desc}</div>` : ''}
        ${linkHTML}
      </div>
      <div class="track-role">${t.role}</div>
    </div>`;
  }).join('');


  // Filter hidden videos, sort featured first
  const visibleVideos = (epk.videos || [])
    .filter(v => v.visible !== false)
    .sort((a, b) => (b.featured?1:0) - (a.featured?1:0));

  const buildVideoCard = (v) => {
    const isMP4 = v.url && (v.url.includes('.mp4') || v.url.includes('.mov') || v.url.includes('.webm') || (v.url.includes('cloudinary') && !v.url.includes('youtube')));
    const thumb = v.thumb || getYouTubeThumb(v.url);
    const videoMeta = (v.album || v.year) ? `<div class="video-meta">${v.album ? `<span>${v.album}</span>` : ''}${v.album && v.year ? ' · ' : ''}${v.year || ''}</div>` : '';
    const videoDesc = v.desc ? `<div class="video-desc">${v.desc}</div>` : '';
    const categoryBadge = v.category ? `<div style="position:absolute;top:0.5rem;left:0.5rem;font-family:var(--font-mono);font-size:0.5rem;letter-spacing:0.1em;text-transform:uppercase;background:rgba(0,0,0,0.7);color:var(--gold);padding:0.15rem 0.5rem;z-index:2">${v.category}</div>` : '';
    const featuredBadge = v.featured ? `<div style="position:absolute;top:0.5rem;right:0.5rem;font-family:var(--font-mono);font-size:0.5rem;letter-spacing:0.1em;text-transform:uppercase;background:rgba(201,168,76,0.9);color:var(--black);padding:0.15rem 0.5rem;z-index:2">⭐ Featured</div>` : '';
    if (isMP4) {
      return `<div class="video-card" style="position:relative">${categoryBadge}${featuredBadge}<video controls style="width:100%;aspect-ratio:16/9;display:block;background:#000;object-fit:contain" ${v.thumb ? `poster="${v.thumb}"` : ''}><source src="${v.url}" type="video/mp4"></video><div class="video-caption">${v.title}</div>${videoMeta}${videoDesc}</div>`;
    }
    return `<div class="video-card" style="position:relative" onclick="window.open('${v.url}','_blank')">${categoryBadge}${featuredBadge}${thumb ? `<img class="video-thumb" src="${thumb}" alt="${v.title}" loading="lazy">` : `<div class="video-thumb" style="background:var(--dark-4);display:flex;align-items:center;justify-content:center;color:var(--gray);font-size:2rem">▶</div>`}<div class="video-play">▶</div><div class="video-caption">${v.title}</div>${videoMeta}${videoDesc}</div>`;
  };

  // Group by category
  const videoCategories = ['Reel', 'Live Performance', 'Music Video', 'Acoustic / Unplugged', 'Interview', 'Podcast', 'Behind the Scenes', 'TV Appearance', 'Other'];
  const groupedVideos = {};
  const uncategorized = [];
  visibleVideos.forEach(v => {
    if (v.category) {
      if (!groupedVideos[v.category]) groupedVideos[v.category] = [];
      groupedVideos[v.category].push(v);
    } else {
      uncategorized.push(v);
    }
  });

  const hasCategories = Object.keys(groupedVideos).length > 0;

  let videosHTML = '';
  if (hasCategories) {
    // Render grouped by category
    Object.entries(groupedVideos).forEach(([cat, vids]) => {
      videosHTML += `<div style="margin-bottom:3rem"><div style="font-family:var(--font-mono);font-size:0.65rem;letter-spacing:0.25em;text-transform:uppercase;color:var(--gold);margin-bottom:1.25rem;display:flex;align-items:center;gap:1rem">${cat}<span style="flex:1;height:1px;background:linear-gradient(to right,rgba(201,168,76,0.2),transparent);max-width:200px;display:inline-block"></span></div><div class="videos-grid">${vids.map(buildVideoCard).join('')}</div></div>`;
    });
    if (uncategorized.length) {
      videosHTML += `<div class="videos-grid">${uncategorized.map(buildVideoCard).join('')}</div>`;
    }
  } else {
    videosHTML = `<div class="videos-grid">${visibleVideos.map(buildVideoCard).join('')}</div>`;
  }

  const categoryIcons = { 'Resume':'📋', 'Press Kit':'📦', 'Tech Rider':'🎛', 'Stage Plot':'🎭', 'Bio':'📝', 'Photo Pack':'📸', 'Contract Template':'📜', 'Certificate':'🏅', 'Other':'📄' };

  const assetsHTML = (epk.assets || [])
    .filter(a => a.visible !== false)
    .map((a, i) => {
      const icon = categoryIcons[a.category] || '📄';
      const categoryTag = a.category ? `<div style="font-family:var(--font-mono);font-size:0.55rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--gray);margin-bottom:0.75rem">${a.category}</div>` : '';
      const downloadAttr = a.url ? `onclick="trackAssetDownload(${epk.assets.indexOf(a)})"` : '';
      return `
    <div class="asset-card">
      <div class="asset-icon">${icon}</div>
      ${categoryTag}
      <div class="asset-title">${a.title}</div>
      <p class="asset-desc">${a.desc || ''}</p>
      ${a.url ? `<a href="${a.url}" class="asset-btn" target="_blank" ${downloadAttr}>${a.btnLabel || 'Download →'}</a>` : `<span class="asset-btn" style="opacity:0.4">${a.btnLabel || 'Coming Soon'}</span>`}
    </div>`;
    }).join('');

  const bookingEmail = epk.bookingEmail || '';
  const bookingPhone = epk.bookingPhone || '';
  const bookingTagline = epk.bookingTagline || 'Now booking live performances, studio sessions, and creative collaborations.';
  const bookingNote = epk.bookingNote || 'Serious inquiries only';

  document.getElementById('epkContent').innerHTML = `
    <!-- HERO -->
    <div class="hero">
      <div class="hero-image-panel">${heroImgHTML}</div>
      <div class="hero-content">
        <p class="hero-eyebrow">Electronic Press Kit</p>
        <h1 class="hero-name">${firstName}<br><em>${lastName}</em></h1>
        ${taglinesHTML ? `<p class="hero-tagline">${taglinesHTML}</p>` : ''}
        <div class="hero-ctas">
          <a href="#booking" class="btn-secondary">Book Now →</a>
        </div>
        ${statsHTML ? `<div class="hero-stats">${statsHTML}</div>` : ''}
        ${(() => {
          const ib = epk.identityBlock || {};
          let blocks = '';

          // Availability Badges
          if (ib.availabilityEnabled && ib.availabilityBadges?.length) {
            blocks += `<div class="identity-block"><div class="identity-block-label">Availability</div><div class="identity-tags">${ib.availabilityBadges.map(b=>`<span class="identity-tag">${b}</span>`).join('')}</div></div>`;
          }
          // Industry Roles
          if (ib.rolesEnabled && ib.industryRoles?.length) {
            blocks += `<div class="identity-block"><div class="identity-block-label">Industry Roles</div><div class="identity-tags">${ib.industryRoles.map(r=>`<span class="identity-tag">${r}</span>`).join('')}</div></div>`;
          }
          // Featured Credit
          if (ib.featuredEnabled && ib.featuredCreditIdx !== '' && epk.credits?.[ib.featuredCreditIdx]) {
            const fc = epk.credits[ib.featuredCreditIdx];
            blocks += `<div class="identity-block"><div class="identity-block-label">Featured Credit</div><div class="identity-featured-credit"><span class="identity-featured-artist">${fc.artist}</span><span class="identity-featured-role">${fc.role}${fc.years ? ' · ' + fc.years : ''}</span></div></div>`;
          }
          // Verification
          if (ib.verifiedEnabled && ib.verificationStatus) {
            blocks += `<div class="identity-block"><div class="identity-block-label">Verification</div><div class="identity-verified">✦ ${ib.verificationStatus}</div></div>`;
          }
          // Languages
          if (ib.languagesEnabled && ib.languages?.length) {
            blocks += `<div class="identity-block"><div class="identity-block-label">Languages</div><div class="identity-langs">${ib.languages.join(' · ')}</div></div>`;
          }
          // Representation
          if (ib.repEnabled && ib.repName) {
            blocks += `<div class="identity-block"><div class="identity-block-label">Representation</div><div class="identity-rep"><span class="identity-rep-name">${ib.repName}</span>${ib.repRole ? `<span class="identity-rep-role">${ib.repRole}</span>` : ''}${ib.repContact ? `<span class="identity-rep-contact">${ib.repContact}</span>` : ''}</div></div>`;
          }
          // Timeline
          if (ib.timelineEnabled && ib.timeline?.length) {
            const items = ib.timeline.map(m=>`<div class="timeline-item"><span class="timeline-year">${m.year}</span><span class="timeline-milestone">${m.milestone}</span></div>`).join('');
            blocks += `<div class="identity-block"><div class="identity-block-label">Career Timeline</div><div class="identity-timeline">${items}</div></div>`;
          }
          return blocks ? `<div class="identity-blocks">${blocks}</div>` : '';
        })()}
      </div>
    </div>

    <!-- BIO -->
    ${epk.bio ? `
    <section id="bio">
      <div class="section-label">Biography</div>
      <div class="bio-grid">
        <div class="bio-sidebar">
          ${bioImgHTML}
          ${contactHTML}
          ${credentialsHTML}
        </div>
        <div class="bio-text">${bioParagraphs}</div>
      </div>
    </section>
    <div class="divider"></div>` : ''}

    <!-- CREDITS -->
    ${epk.credits?.length ? `
    <div class="credits-section" id="credits">
      <div class="credits-inner">
        <div class="section-label">Credits & Collaborations</div>
        <h2 class="section-title">The Record</h2>
        <div class="credits-grid">${creditsHTML}</div>
      </div>
    </div>` : ''}

    <!-- MUSIC -->
    ${epk.tracks?.length ? `
    <section id="music">
      <div class="section-label">Live Music Tracks</div>
      <h2 class="section-title">On Record</h2>
      <div class="music-tracks">${tracksHTML}</div>
    </section>
    <div class="divider"></div>` : ''}

    <!-- VIDEOS -->
    ${visibleVideos.length ? `
    <section id="videos">
      <div class="section-label">Video</div>
      <h2 class="section-title">Live & On Camera</h2>
      ${videosHTML}
    </section>
    <div class="divider"></div>` : ''}

    <!-- PHOTOS -->
    ${epk.photos?.length ? `
    <div class="gallery-section" id="photos">
      <div class="gallery-inner">
        <div class="section-label">Photos</div>
        <h2 class="section-title">On Stage & Behind the Scenes</h2>
        <div id="galleryContent"></div>
      </div>
    </div>` : ''}

    <!-- ASSETS -->
    ${epk.assets?.length ? `
    <section id="assets">
      <div class="section-label">Professional Assets</div>
      <h2 class="section-title">Resources</h2>
      <div class="assets-grid">${assetsHTML}</div>
    </section>` : ''}

    <!-- CONNECT -->
    ${connectSectionHTML}

    <!-- BOOKING -->
    <div class="booking-section" id="booking">
      <div class="booking-inner">
        <h2 class="booking-title">Let's Create Something <em>Unforgettable</em></h2>
        <p class="booking-sub">${bookingTagline}</p>
        <p class="booking-note">${bookingNote}</p>
        <div class="booking-ctas">
          ${bookingEmail ? `<a href="mailto:${bookingEmail}" class="btn-primary">✉ Send Booking Inquiry</a>` : ''}
          ${bookingPhone ? `<a href="tel:${bookingPhone}" class="btn-secondary">☎ Call to Discuss</a>` : ''}
        </div>
      </div>
    </div>
  `;

  // Build photo gallery if photos exist
  if (epk.photos?.length) buildGallery(epk.photos);
}

function buildGallery(photos) {
  const container = document.getElementById('galleryContent');
  if (!container) return;

  // All photos go into one pool, distributed across 4 columns
  const numCols = 5;
  const cols = [[], [], [], [], []];
  photos.forEach((p, i) => cols[i % numCols].push(p));

  const grid = document.createElement('div');
  grid.className = 'gallery-4col';

  cols.forEach((colPhotos, colIdx) => {
    if (!colPhotos.length) return;
    const col = document.createElement('div');
    col.className = 'gallery-col';
    const state = { current: 0 };

    colPhotos.forEach((photo, i) => {
      const slide = document.createElement('div');
      slide.className = 'gallery-slide' + (i === 0 ? ' active' : '');
      slide.innerHTML = `<img src="${photo.url}" alt="${photo.caption || ''}" loading="lazy" onclick="openLightbox('${photo.url}')" onerror="this.style.display='none'"><div class="gallery-caption">${photo.caption || ''}</div>`;
      col.appendChild(slide);
    });

    // Auto-rotate each column at different speeds
    if (colPhotos.length > 1) {
      setInterval(() => {
        const slides = col.querySelectorAll('.gallery-slide');
        slides[state.current].classList.remove('active');
        state.current = (state.current + 1) % colPhotos.length;
        slides[state.current].classList.add('active');
      }, 3000 + colIdx * 800);
    }

    grid.appendChild(col);
  });

  container.innerHTML = '';
  container.appendChild(grid);
}

function goToSlide(col, state, idx) {
  const slides = col.querySelectorAll('.gallery-slide');
  const dots = col.querySelectorAll('.gallery-dot');
  if (slides[state.current]) slides[state.current].classList.remove('active');
  if (dots[state.current]) dots[state.current].classList.remove('active');
  state.current = idx;
  if (slides[state.current]) slides[state.current].classList.add('active');
  if (dots[state.current]) dots[state.current].classList.add('active');
}

function navigateSlide(col, state, total, dir) {
  const next = (state.current + dir + total) % total;
  goToSlide(col, state, next);
}

// Init
const slug = getSlugFromURL();
if (slug) {
  // Try API first
  fetch('/api/epk', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'load', slug })
  })
  .then(res => res.json())
  .then(data => {
    if (data.success && data.epk) {
      try {
        buildEPK(data.epk);
      } catch(err) {
        document.getElementById('epkContent').innerHTML = '<div style="padding:8rem 3rem;text-align:center;font-family:var(--font-mono);color:var(--gray);font-size:0.8rem">Error: ' + err.message + '<br><br><a href="/" style="color:var(--gold)">Return home →</a></div>';
      }
    } else {
      const epk = getEPKData(slug);
      if (epk) {
        buildEPK(epk);
      } else {
        document.getElementById('epkContent').innerHTML = '<div style="padding:8rem 3rem;text-align:center;font-family:var(--font-mono);color:var(--gray)">EPK not found. <a href="/" style="color:var(--gold)">Return home →</a></div>';
      }
    }
  })
  .catch((err) => {
    const epk = getEPKData(slug);
    if (epk) {
      buildEPK(epk);
    } else {
      document.getElementById('epkContent').innerHTML = '<div style="padding:8rem 3rem;text-align:center;font-family:var(--font-mono);color:var(--gray)">Fetch error: ' + err.message + '<br><a href="/" style="color:var(--gold)">Return home →</a></div>';
    }
  });
} else {
  window.location.href = '/index.html';
}

// Lyrics toggle
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('lyrics-toggle')) {
    const id = e.target.getAttribute('data-id');
    const el = document.getElementById(id);
    if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
  }
});

// Asset download tracking
function trackAssetDownload(idx) {
  try {
    fetch('/api/epk', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'trackDownload', slug: getSlugFromURL(), assetIdx: idx })
    });
  } catch(e) {}
}

// Credit modal
let epkCreditsData = [];
let epkVisibleCredits = [];
function openCreditModal(i) {
  const c = epkVisibleCredits[i];
  if (!c) return;
  const photos = c.photos || [];
  document.getElementById('creditModalArtist').textContent = c.artist;
  document.getElementById('creditModalMeta').textContent = [c.role, c.contractType, c.years].filter(Boolean).join(' · ');
  document.getElementById('creditModalDesc').textContent = c.fullDesc || c.desc || '';

  // Collaborators
  const collabEl = document.getElementById('creditModalCollaborators');
  collabEl.innerHTML = c.collaborators?.length ? `<div style="font-family:var(--font-mono);font-size:0.6rem;letter-spacing:0.1em;color:var(--gray);margin-bottom:1rem">w/ ${c.collaborators.join(', ')}</div>` : '';

  // Media
  const mediaHTML = (() => {
    let html = '';
    if (c.videoUrl) {
      html += `<video controls style="width:100%;aspect-ratio:16/9;display:block;background:#000;object-fit:contain;margin-bottom:1rem" src="${c.videoUrl}"></video>`;
    }
    // YouTube embed
    if (c.mediaLink) {
      const ytId2 = c.mediaLink.split('v=')[1]?.split('&')[0] || c.mediaLink.split('youtu.be/')[1]?.split('?')[0];
      if (ytId2) {
        html += `<div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;margin-bottom:1rem"><iframe src="https://www.youtube.com/embed/${ytId2}" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none" allowfullscreen></iframe></div>`;
      } else {
        const label = c.mediaLabel || 'View Media →';
        html += `<a href="${c.mediaLink}" target="_blank" style="display:inline-flex;align-items:center;gap:0.5rem;font-family:var(--font-mono);font-size:0.65rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--gold);text-decoration:none;border:1px solid rgba(201,168,76,0.3);padding:0.5rem 1rem;margin-bottom:1rem;transition:all 0.3s" onmouseover="this.style.background='rgba(201,168,76,0.08)'" onmouseout="this.style.background=''">${label}</a>`;
      }
    }
    // Proof link
    if (c.proofLink) {
      html += `<div style="margin-top:0.5rem"><a href="${c.proofLink}" target="_blank" style="font-family:var(--font-mono);font-size:0.55rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--gray);text-decoration:none;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:1px">✦ View Verification Source →</a></div>`;
    }
    return html;
  })();
  document.getElementById('creditModalMedia').innerHTML = mediaHTML;
  document.getElementById('creditModalPhotos').innerHTML = photos.map(url =>
    `<img class="credit-modal-photo" src="${url}" alt="${c.artist}" loading="lazy" onclick="openLightbox('${url}')" onerror="this.style.display='none'">`
  ).join('');
  document.getElementById('creditModalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeCreditModal() {
  document.getElementById('creditModalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}
// Lightbox for photos
function openLightbox(url) {
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightboxOverlay').style.display = 'flex';
}
function closeLightbox() {
  document.getElementById('lightboxOverlay').style.display = 'none';
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeCreditModal(); closeLightbox(); }
});
</script>
