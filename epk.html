<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Portfolio — PorfolioID</title>
  <meta name="description" content="A professional identity and portfolio platform for modern creatives and professionals. Powered by PorfolioID.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/epk.css">
</head>
<body>

<nav>
  <a href="/index.html" class="nav-logo">Porfolio<span>ID</span></a>
  <ul class="nav-links" id="navLinks"></ul>
  <a href="/dashboard.html" class="nav-edit-btn" id="editBtn">Edit Portfolio</a>
</nav>

<div id="epkContent"></div>

<footer>
  <div class="footer-logo" id="footerLogo"></div>
  <div class="footer-copy">All rights reserved</div>
</footer>

<script src="/epk.js" defer></script>

<!-- Credit Detail Modal -->
<div class="credit-modal-overlay" id="creditModalOverlay" onclick="if(event.target===this)closeCreditModal()">
  <div class="credit-modal">
    <button class="credit-modal-close" onclick="closeCreditModal()">✕ CLOSE</button>
    <div class="credit-modal-artist" id="creditModalArtist"></div>
    <div class="credit-modal-meta" id="creditModalMeta"></div>
    <div class="credit-modal-desc" id="creditModalDesc"></div>
    <div id="creditModalCollaborators"></div>
    <div id="creditModalMedia" style="margin-top:1.25rem"></div>
    <div class="credit-modal-photos" id="creditModalPhotos"></div>
    <div id="creditModalPress"></div>
  </div>
</div>

<!-- Lightbox -->
<div id="lightboxOverlay" onclick="closeLightbox()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.95);z-index:9999;align-items:center;justify-content:center;cursor:zoom-out">
  <img id="lightboxImg" src="" style="max-width:92vw;max-height:92vh;object-fit:contain">
</div>

<!-- Award Modal -->
<div id="awardModalOverlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:1000;align-items:center;justify-content:center;padding:1rem" onclick="if(event.target===this)closeAwardModal()">
  <div style="background:#111;border:1px solid rgba(201,168,76,0.2);max-width:580px;width:100%;max-height:90vh;overflow-y:auto;position:relative">
    <button onclick="closeAwardModal()" style="position:absolute;top:1rem;right:1rem;background:none;border:none;color:#888;font-size:1rem;cursor:pointer;font-family:monospace;letter-spacing:0.1em;z-index:1">✕ CLOSE</button>
    <div id="awardModalContent" style="padding:2rem"></div>
  </div>
</div>

<!-- Share Modal -->
<div id="shareModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:1000;align-items:center;justify-content:center">
  <div style="background:#111;border:1px solid rgba(201,168,76,0.2);padding:2.5rem;max-width:420px;width:90%;position:relative">
    <button onclick="closeShareModal()" style="position:absolute;top:1rem;right:1rem;background:none;border:none;color:#888;font-size:1.2rem;cursor:pointer">✕</button>
    <div style="font-family:monospace;font-size:0.55rem;letter-spacing:0.2em;text-transform:uppercase;color:#C9A84C;margin-bottom:0.5rem">Share Portfolio</div>
    <h3 style="font-size:1.2rem;color:#fff;margin-bottom:1.5rem;font-weight:400">Scan to view my PorfolioID</h3>
    <div style="display:flex;flex-direction:column;align-items:center;margin-bottom:1.5rem">
      <div style="background:white;padding:0.75rem;margin-bottom:1rem" id="modalQRCode"></div>
      <div style="font-family:monospace;font-size:0.55rem;color:#888;text-align:center;word-break:break-all" id="modalQRUrl"></div>
    </div>
    <div style="display:flex;gap:0.75rem">
      <button onclick="copyEPKLink()" id="modalCopyBtn" style="flex:1;font-family:monospace;font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.3);color:#C9A84C;padding:0.75rem;cursor:pointer">⎘ Copy Link</button>
      <button onclick="downloadEPKQR()" style="flex:1;font-family:monospace;font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;background:#C9A84C;border:none;color:#000;padding:0.75rem;cursor:pointer">↓ Download QR</button>
    </div>
  </div>
</div>

<!-- Owner Bar -->
<div class="owner-bar">
  <span class="owner-bar-label">✦ Owner Mode — Hover items to reorder</span>
  <a href="/dashboard.html" style="font-family:var(--font-mono);font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--gold);text-decoration:none;border:1px solid rgba(201,168,76,0.3);padding:0.4rem 0.9rem;transition:all 0.2s">Dashboard →</a>
</div>

</body>
</html>
