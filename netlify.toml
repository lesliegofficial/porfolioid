[build]
  functions = "netlify/functions"
  publish = "."
  ignore = "git diff --quiet HEAD^ HEAD -- . ':(exclude)_backups'"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/epk/:slug"
  to = "/epk.html?slug=:slug"
  status = 200

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
