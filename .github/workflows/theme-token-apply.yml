name: Apply theme token conversion

on:
  push:
    branches: [theme-token-conversion]
    paths:
      - .github/workflows/theme-token-apply.yml
      - scripts/theme_token_conversion.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: theme-token-conversion
          fetch-depth: 0
      - name: Apply audited conversion
        run: |
          sed -i 's/if css.count("#d7b84f") != gate5_css_before:/if css.count("#d7b84f") != gate5_css_before + 1:/' scripts/theme_token_conversion.py
          sed -i 's/if js.count("#d7b84f") != gate5_js_before:/if js.count("#d7b84f") != gate5_js_before + 1:/' scripts/theme_token_conversion.py
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/theme_token_conversion.py')
          s = p.read_text()
          marker = '# ---------------------------------------------------------------------------\n# SAFETY CHECKS\n# ---------------------------------------------------------------------------'
          addition = '''# Remaining fixed Professional Blue path: Awards / Degrees & Credentials section header.\njs = js.replace("rgba(123,155,175,", "rgb(var(--category-professional-rgb) / ")\njs = js.replace("#8FB8D0", "var(--category-professional)")\n\n'''
          if marker not in s:
              raise SystemExit('Safety marker not found')
          p.write_text(s.replace(marker, addition + marker, 1))
          PY
          python scripts/theme_token_conversion.py
      - name: Commit converted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epk.css epk.js
          if git diff --cached --quiet; then
            echo "No conversion changes to commit"
            exit 0
          fi
          git commit -m "Implement audited theme token architecture"
          git push origin HEAD:theme-token-conversion
