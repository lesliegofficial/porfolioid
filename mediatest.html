<!DOCTYPE html>
<html>
<head><title>Media Test</title></head>
<body style="background:#111;color:white;font-family:monospace;padding:20px">
<h2>NV Credit — All Media Items</h2>
<div id="out"></div>
<script>
fetch('/api/epk?slug=leslie-guerra')
  .then(r=>r.json())
  .then(d=>{
    const c = d.credits.find(c=>c.company&&c.company.includes('NV'));
    const photos = c.photos||[];
    const mediaItems = c.mediaItems||[];
    
    let html = `<p style="color:yellow">Videos: ${mediaItems.length} | Photos: ${photos.length}</p>`;
    html += '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px">';
    
    mediaItems.forEach((m,i)=>{
      html += `<div style="border:2px solid orange;padding:4px">
        <p style="font-size:11px;margin:2px;color:orange">VIDEO ${i+1}: ${m.label}</p>
        <p style="font-size:9px;margin:2px;color:#888">thumb: ${(m.thumb||'').slice(-50)}</p>
        <div style="position:relative">
          <img src="${m.thumb||''}" style="width:100%;height:auto;display:block" 
            onload="this.parentElement.nextElementSibling.textContent='Loaded: '+this.naturalWidth+'x'+this.naturalHeight"
            onerror="this.parentElement.nextElementSibling.textContent='FAILED TO LOAD'">
          <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,0.7);border:2px solid gold;display:flex;align-items:center;justify-content:center;color:gold">▶</div>
        </div>
        <p style="font-size:9px;color:lime;margin:2px"></p>
      </div>`;
    });
    
    photos.forEach((url,i)=>{
      html += `<div style="border:2px solid cyan;padding:4px">
        <p style="font-size:11px;margin:2px;color:cyan">PHOTO ${i+1}</p>
        <img src="${url}" style="width:100%;height:auto;display:block"
          onload="this.nextElementSibling.textContent='Loaded: '+this.naturalWidth+'x'+this.naturalHeight"
          onerror="this.nextElementSibling.textContent='FAILED'">
        <p style="font-size:9px;color:lime;margin:2px"></p>
      </div>`;
    });
    
    html += '</div>';
    document.getElementById('out').innerHTML = html;
  });
</script>
</body>
</html>
