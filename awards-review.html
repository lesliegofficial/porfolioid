<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Awards-Degrees Photo Review</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0E0E0E; color: #F5F3EE; font-family: 'Helvetica Neue', sans-serif; padding: 2rem; }
  h1 { color: #C9A84C; font-size: 1.4rem; font-weight: 600; margin-bottom: 0.25rem; }
  p.sub { color: #888; font-size: 0.85rem; margin-bottom: 2rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
  .card { background: #141414; border: 1px solid #242424; border-radius: 8px; overflow: hidden; }
  .card img { width: 100%; height: 220px; object-fit: contain; background: #1C1C1C; display: block; padding: 0.5rem; }
  .label { padding: 0.75rem 1rem; }
  .num { font-size: 1.1rem; font-weight: 700; color: #C9A84C; }
  .id { font-size: 0.65rem; color: #555; margin-top: 4px; font-family: monospace; word-break: break-all; }
</style>
</head>
<body>
<h1>Awards & Degrees — Cloudinary Folder</h1>
<p class="sub">6 images. Tell me which award card each one belongs to.</p>
<div class="grid">

</div>

  <div class="label"><div class="num">#2</div><div class="id">apw3zngzif4uxweqfn9a</div></div>

  <div class="label"><div class="num">#3</div><div class="id">zjz3grw21r7nqtwgajh8</div></div>

</html>
